name: Scholarship watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "텔레그램 연동 테스트 메시지만 보내고 종료 (공지 확인은 하지 않음)"
        type: boolean
        default: false
      custom_message:
        description: "지정하면 이 텍스트(HTML 허용)를 텔레그램으로 보내고 종료 (공지 확인은 하지 않음)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scholarship-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scholarship watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram }}
          CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: python scripts/check_scholarship.py

      - name: Commit updates
        run: |
          git config user.name "scholarship-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json docs/index.html docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update scholarship watch data"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
